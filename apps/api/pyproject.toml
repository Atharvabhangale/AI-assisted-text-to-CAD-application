[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-api"
version = "0.1.0"
description = "HTTP transport and AI interpretation layer over cad-core"
requires-python = ">=3.9"
# The minimum this transport needs, and nothing else. FastAPI brings Starlette
# and Pydantic with it; no client, database, cache or auth library is used.
dependencies = [
    "cad-core",
    "fastapi>=0.141",
]

[project.optional-dependencies]
# Starlette's TestClient needs an HTTP client. This Starlette (1.6.0) asks for
# httpx2 and deprecates httpx, measured from its own warning.
test = ["httpx2>=2.12"]
# Serving is not part of this stage; one ASGI server, declared and not used by
# any import in this package.
serve = ["uvicorn>=0.30"]
# The natural-language interpretation layer (cad_ai). Provider SDKs only: no
# agent framework, no vector store, no orchestration library. Each is optional
# and each is imported lazily by its own provider module, so the HTTP
# transport and cad-core install without either, and importing cad_ai needs
# neither.
ai = ["anthropic>=1.4"]
ai-gemini = ["google-genai>=2.22"]

[tool.setuptools.packages.find]
where = ["src"]
